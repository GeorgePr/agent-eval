[project]
name = "agenteval"
version = "0.1.0"
description = "CLI-first agent regression testing: run agent -> score behavior -> diff against baseline -> exit non-zero on regression"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
