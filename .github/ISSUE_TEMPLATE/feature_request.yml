name: Feature request
description: Propose new AgentEval behavior.
title: "[feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        AgentEval's core is **deterministic** assertions with a thin dependency
        surface (stdlib + pyyaml). Please frame requests with that boundary in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that AgentEval can't do today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: deterministic-alternative
    attributes:
      label: Deterministic assertion alternative
      description: Could this be a deterministic assertion or config option? If so, sketch it.
    validations:
      required: false
  - type: textarea
    id: ci-impact
    attributes:
      label: CI/CD impact
      description: How would this affect exit codes, artifacts, or the release path?
    validations:
      required: false
  - type: dropdown
    id: dependency-impact
    attributes:
      label: Dependency impact
      options:
        - "None (stdlib only)"
        - "Uses existing runtime dep (pyyaml)"
        - "Would need a new runtime dependency"
    validations:
      required: true
  - type: dropdown
    id: external
    attributes:
      label: Does it require an LLM or hosted service?
      options:
        - "No"
        - "Yes — optional add-on only (semantic/judge style)"
        - "Yes — required"
    validations:
      required: true
